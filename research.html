<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Research - Basanta Ghimire</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(135deg, #051937, #121212 70%, #26d0ce 100%);
      color: #c6ffe7;
      font-family: 'Montserrat', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }
    header {
      text-align: center;
      padding: 50px 20px 20px 20px;
      border-bottom: 2px solid #0ff;
      margin-bottom: 40px;
    }
    .name {
      font-family: 'Orbitron', 'Montserrat', Arial, sans-serif;
      font-size: 3em;
      background: linear-gradient(90deg, #81ffef, #f067b4 50%, #63cfff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px #14ffe9, 0 0 5px #252728;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .section {
      padding: 40px 10vw;
      margin-bottom: 30px;
      background: rgba(18,34,51,0.45);
      border-radius: 20px;
      box-shadow: 0 2px 36px #00f2ff22, 0 8px 8px #10073833;
    }
    .section h2 {
      font-family: 'Orbitron', Arial, sans-serif;
      color: #14ffe9;
      letter-spacing: 2px;
      text-shadow: 0 0 6px #32e4ff99;
      border-bottom: 2px solid #56ffc7;
      display: inline-block;
      margin-bottom: 15px;
      font-size: 1.7em;
    }
    .placeholder {
      opacity: 0.7;
      font-style: italic;
      font-size: 1.1em;
      color: #bdffe5;
      padding: 5px 0;
    }
    .nav-link {
      display: inline-block;
      margin: 10px 15px;
      padding: 8px 16px;
      background: linear-gradient(135deg, #20e3b2, #2cccff, #fc5c7d);
      color: white;
      text-decoration: none;
      border-radius: 20px;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(38, 208, 206, 0.3);
    }
    .nav-link:hover {
      background: linear-gradient(135deg, #fed6e3, #3ee3ff 75%, #12fff7 100%);
      box-shadow: 0 0 25px rgba(129, 255, 239, 0.6);
      transform: translateY(-2px);
    }
    @media (max-width:700px){
      .section{padding:30px 4vw;}
      .name{font-size:2em;}
    }
  </style>
</head>
<body>
  <header>
    <div class="name">Research</div>
    <div class="placeholder">
      Basanta Ghimire's Research Portfolio
    </div>
    <nav>
      <a href="index.html" class="nav-link">Home</a>
      <a href="social.html" class="nav-link">Social Links</a>
    </nav>
  </header>
  <section class="section">
    <h2>Research Areas</h2>
    <div class="placeholder">

    </div>
  </section>
  <section class="section">

  <section class="section">

</body>
</html>
