<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basanta Ghimire</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated background elements */
        .bg-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            animation: float 20s infinite ease-in-out;
            opacity: 0.6;
        }

        .orb1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb2 {
            width: 350px;
            height: 350px;
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            bottom: -10%;
            right: -5%;
            animation-delay: -5s;
        }

        .orb3 {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #ffd89b 0%, #19547b 100%);
            top: 50%;
            right: 10%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(50px, -50px) scale(1.1);
            }
            50% {
                transform: translate(-30px, 30px) scale(0.9);
            }
            75% {
                transform: translate(40px, 50px) scale(1.05);
            }
        }

        /* Particle effect */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: particle-float 15s infinite linear;
        }

        @keyframes particle-float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 600px;
            width: 90%;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 60px 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        0 0 80px rgba(245, 87, 108, 0.2),
                        inset 0 0 40px rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #f093fb, #f5576c, #4facfe, #00f2fe, #ffd89b);
            border-radius: 30px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s;
            background-size: 400% 400%;
            animation: gradient-shift 8s ease infinite;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card:hover::before {
            opacity: 0.6;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4),
                        0 0 120px rgba(245, 87, 108, 0.4),
                        inset 0 0 60px rgba(255, 255, 255, 0.08);
        }

        .glow-text {
            font-family: 'Playfair Display', serif;
            font-size: 72px;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #f5576c 50%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            display: inline-block;
            animation: glow-pulse 3s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(245, 87, 108, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(79, 172, 254, 0.8));
            }
        }

        .divider {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #f5576c, #4facfe, transparent);
            margin: 30px auto;
            position: relative;
            animation: divider-glow 2s ease-in-out infinite;
        }

        @keyframes divider-glow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(245, 87, 108, 0.5);
            }
            50% {
                box-shadow: 0 0 20px rgba(79, 172, 254, 0.8);
            }
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }

        .link-item {
            position: relative;
            padding: 16px 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 400;
            font-size: 16px;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(245, 87, 108, 0.5);
            transform: translateX(10px);
            box-shadow: 0 4px 20px rgba(245, 87, 108, 0.3);
        }

        .link-item:nth-child(2):hover {
            border-color: rgba(79, 172, 254, 0.5);
            box-shadow: 0 4px 20px rgba(79, 172, 254, 0.3);
        }

        .link-item:nth-child(3):hover {
            border-color: rgba(255, 216, 155, 0.5);
            box-shadow: 0 4px 20px rgba(255, 216, 155, 0.3);
        }

        @media (max-width: 600px) {
            .glow-text {
                font-size: 48px;
            }
            .card {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="card">
            <h1 class="glow-text">basanta ghimire</h1>
            <div class="divider"></div>
            <div class="links">
                <a href="mailto:basantaghimire456@gmail.com" class="link-item">basantaghimire456@gmail.com</a>
                <a href="mailto:basantg@clemson.edu" class="link-item">basantg@clemson.edu</a>
                <a href="https://linkedin.com/in/basanta-ghimire" target="_blank" class="link-item">linkedin</a>
            </div>
        </div>
    </div>

    <script>
        // Create particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
