<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basanta Ghimire</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #051937, #121212 70%, #26d0ce 100%);
      color: #c6ffe7;
      font-family: 'Montserrat', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }
    header {
      text-align: center;
      padding: 50px 20px 20px 20px;
      border-bottom: 2px solid #0ff;
      margin-bottom: 40px;
    }
    .name {
      font-family: 'Orbitron', 'Montserrat', Arial, sans-serif;
      font-size: 3em;
      background: linear-gradient(90deg, #81ffef, #f067b4 50%, #63cfff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px #14ffe9, 0 0 5px #252728;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .section {
      padding: 40px 10vw;
      margin-bottom: 30px;
      background: rgba(18,34,51,0.45);
      border-radius: 20px;
      box-shadow: 0 2px 36px #00f2ff22, 0 8px 8px #10073833;
    }
    .section h2 {
      font-family: 'Orbitron', Arial, sans-serif;
      color: #14ffe9;
      letter-spacing: 2px;
      text-shadow: 0 0 6px #32e4ff99;
      border-bottom: 2px solid #56ffc7;
      display: inline-block;
      margin-bottom: 15px;
      font-size: 1.7em;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .section h2:hover {
      text-shadow: 0 0 12px #32e4ff, 0 0 20px #14ffe9;
      transform: translateY(-2px);
    }
    .section-link {
      color: inherit;
      text-decoration: none;
    }
    .social-links {
      margin-top: 20px;
      display: flex;
      gap: 2em;
      justify-content: start;
      flex-wrap: wrap;
    }
    .social-icon {
      display: inline-block;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #20e3b2, #2cccff, #fc5c7d);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px #26d0ce80;
      transition: background 0.4s, box-shadow 0.4s;
      font-size: 2em;
      color: white;
      text-decoration: none;
    }
    .social-icon:hover {
      background: linear-gradient(135deg, #fed6e3, #3ee3ff 75%, #12fff7 100%);
      box-shadow: 0 0 36px #81ffef99;
    }
    .placeholder {
      opacity: 0.7;
      font-style: italic;
      font-size: 1.1em;
      color: #bdffe5;
      padding: 5px 0;
    }
    @media (max-width:700px){
      .section{padding:30px 4vw;}
      .name{font-size:2em;}
    }
  </style>
</head>
<body>
  <header>
    <div class="name">Basanta Ghimire</div>
    <div class="placeholder">
