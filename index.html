<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basanta Ghimire - Energy Engineer</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      color: #222;
      height: 100%;
      min-height: 100vh;
      /* Multi-stop animated energy gradient with radial highlight */
      background:
        radial-gradient(ellipse 60% 35% at 60% 30%, rgba(249,255,233,0.7) 0%,rgba(255,255,255,0.1) 80%,transparent 100%),
        linear-gradient(120deg, #10d9e5 0%, #fffde4 60%, #c0ff99 100%);
      background-size: 200% 200%;
      animation: energyBg 12s ease-in-out infinite;
    }
    @keyframes energyBg {
      0% {background-position: 100% 0, 0% 100%;}
      50% {background-position: 0 100%, 100% 0;}
      100% {background-position: 100% 0, 0% 100%;}
    }
    /* Glass morphism main card */
    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 110px 0 40px 0;
    }
    .container {
      max-width: 820px;
      width: 98%;
      display: grid;
      grid-template-columns: 1fr 290px;
      gap: 3.7rem;
      align-items: center;
      background: rgba(255,255,255,0.35);
      border-radius: 34px;
      box-shadow: 0 10px 60px 0 rgba(32,212,204,0.13), 0 2.5px 32px 0 rgba(58,171,210,0.08);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(57,222,175,0.11);
      transition: box-shadow 0.32s;
    }
    .container:hover {
      box-shadow: 0 16px 80px 0 rgba(32,212,185,0.19), 0 12px 52px 0 rgba(18,121,235,0.11);
      border-color: #7ddff8;
    }
    .content {
      padding-right: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .profile-image {
      width: 270px;
      height: 270px;
      border-radius: 30px;
      background: url('images/basanta.jpg') center/cover;
      box-shadow:
        0 0 40px 0 #a6ffd9cc,
        0 5px 32px 0 #12e1ea55;
      margin-bottom: 2.1rem;
      /* Glowing animated border effect */
      position: relative;
      transition: box-shadow 0.3s;
    }
    .profile-image:before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 36px;
      background: linear-gradient(120deg,#0cfac6 20%,#f3fd92 80%);
      opacity: 0.47;
      filter: blur(12px);
      z-index: 0;
      animation: glowPulse 4.8s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0% { opacity: 0.37; filter: blur(9px);}
      40% { opacity: 0.57; filter: blur(19px);}
      100% { opacity: 0.37; filter: blur(9px);}
    }
    .profile-image:hover {
      box-shadow: 0 0 70px 0 #bfffd2, 0 8px 58px 0 #0ff1cd77;
    }
    .hire-btn {
      background: linear-gradient(92deg,#07a9ee 30%, #16e19c 100%);
      color: white;
      padding: 1.1rem 2.3rem;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 18px #13e5c299;
      transition: all 0.23s;
      box-shadow: 0 4px 22px rgba(37, 202, 235, 0.22);
      text-decoration: none;
    }
    .hire-btn:hover {
      background: linear-gradient(93deg,#53f6f1 0%, #82f7b1 86%);
      color: #041b23;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 12px 32px rgba(45, 203, 183, 0.21);
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(18px);
      z-index: 1000;
      padding: 1rem 0;
      border-bottom: 1.5px solid rgba(0, 220, 105, 0.08);
      box-shadow: 0 3px 18px rgba(62,219,187,0.08);
    }
    nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2.3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #12c2e9;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 8px #c7ffd688;
    }
    .nav-links {
      display: flex;
      list-style: none;
      gap: 2.2rem;
    }
    .nav-links a {
      text-decoration: none;
      color: #2d728c;
      font-weight: 500;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      transition: color 0.3s;
      position: relative;
    }
    .nav-links a:after {
      content: '';
      display: block;
      width: 0%;
      height: 2px;
      background: #10d9e5;
      border-radius: 1px;
      transition: width 0.28s;
      position: absolute;
      left: 0; bottom: -4px;
    }
    .nav-links a:hover {
      color: #0fbea1;
    }
    .nav-links a:hover:after,
    .nav-links a.active:after {
      width: 100%;
    }
    .social-icons {
      display: flex;
      gap: 1rem;
    }
    .social-icons a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 37px;
      height: 37px;
      background: #f6fffa;
      border: 1.3px solid #d0e9e9;
      border-radius: 12px;
      text-decoration: none;
      font-size: 21px;
      color: #12b3e6;
      box-shadow: 0 2.5px 12px #14eed212;
      transition: all 0.3s;
    }
    .social-icons a:hover {
      background: #10d9e5;
      border-color: #14be7e;
      color: #fff;
      transform: translateY(-3px) scale(1.07);
      box-shadow: 0 6px 26px #18e6ca29;
    }
    h1 {
      font-size: 3.65rem;
      font-weight: 300;
      margin-bottom: 1rem;
      color: #134468;
      line-height: 1.1;
      position: relative;
      letter-spacing: 0.03em;
    }
    h1 span.name {
      font-weight: 700;
      color: #09c8b4;
      background: linear-gradient(93deg,#13e1e7,#00ffb8 83%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
      position: relative;
      z-index: 1;
    }
    h1:after {
      content: '';
      position: absolute;
      left: 0; bottom: -7px;
      width: 80px;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(93deg,#13e1e7 50%,#f2fda7);
      filter: blur(0.5px);
      opacity: 0.42;
    }
    .subtitle {
      font-size: 1.35rem;
      color: #14b07f;
      margin-bottom: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .description {
      font-size: 1.1rem;
      color: #3b6072;
      margin-bottom: 2rem;
      line-height: 1.8;
      max-width: 500px;
      font-weight: 400;
    }
    @media (max-width: 1050px) {
      .container {
        grid-template-columns: 1fr;
        gap: 2.3rem;
        text-align: center;
        padding: 2rem 0.5rem;
      }
      .content {padding-right: 0;}
      main {padding-top: 110px;}
      .profile-image { margin-left: auto; margin-right: auto;}
    }
    @media (max-width: 600px) {
      .container { padding: 0.3em; }
      .profile-image { width: 150px; height: 150px;}
      h1 { font-size: 2.05rem; }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">Basanta Ghimire</div>
      <div class="nav-links">
        <a href="index.html" class="active">Home</a>
        <a href="aboutme.html">About</a>
        <a href="research.html">Research</a>
        <a href="cv.html">CV</a>
      </div>
      <div class="social-icons">
        <a href="https://linkedin.com/in/basanta-ghimire" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="https://github.com/bsn456" title="GitHub"><i class="fab fa-github"></i></a>
        <a href="mailto:basanta@email.com" title="Email"><i class="fas fa-envelope"></i></a>
      </div>
    </nav>
  </header>
  <main>
    <div class="container">
      <div class="content">
        <h1>Hi, I'm <span class="name">Basanta</span></h1>
        <div class="subtitle">Energy Systems Engineer</div>
        <div class="description">
          I specialize in designing innovative energy generation and storage solutions.<br>
          Passionate about sustainable technology and creating efficient power systems
          for the future.
        </div>
      </div>
      <div class="profile-section">
        <div class="profile-image"></div>
        <a href="cv.html" class="hire-btn">Hire Me</a>
      </div>
    </div>
  </main>
</body>
</html>
