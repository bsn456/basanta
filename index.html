<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basanta Ghimire - Energy Engineer</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: #fff;
      box-sizing: border-box;
    }
    body {
      /* Full background image with dark overlay for contrast */
      min-height: 100vh;
      width: 100vw;
      background: url('images/battery.png') center center / cover no-repeat fixed;
      position: relative;
    }
    body:before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(18, 22, 28, 0.55); /* dark overlay for readability */
      z-index: 0;
      pointer-events: none;
      backdrop-filter: blur(2px);
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(36,36,42,0.44);
      backdrop-filter: blur(10px);
      z-index: 10;
      box-shadow: 0 2px 18px rgba(32,50,60,0.04);
      padding: 0.7rem 0;
      border-bottom: 1px solid rgba(180,200,220,0.03);
    }
    nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #78e1ff;
      letter-spacing: 0.01em;
    }
    .nav-links {
      display: flex;
      gap: 2.1rem;
    }
    .nav-links a {
      text-decoration: none;
      color: #f0f0f0;
      font-weight: 500;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
      opacity: 0.93;
      transition: color 0.3s, opacity 0.2s;
      position: relative;
    }
    .nav-links a:after {
      content: '';
      display: block;
      width: 0%;
      height: 2px;
      background: #6cf2bc;
      border-radius: 1px;
      transition: width 0.25s;
      position: absolute;
      left: 0; bottom: -4px;
    }
    .nav-links a:hover, .nav-links a.active {
      color: #8befc7;
      opacity: 1;
    }
    .nav-links a:hover:after,
    .nav-links a.active:after {
      width: 100%;
    }

    .social-icons {
      display: flex;
      gap: 1.1rem;
    }
    .social-icons a {
      background: rgba(35,47,54,.5);
      border: 1.3px solid #bdd7e7;
      border-radius: 11px;
      width: 37px; height: 37px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: #d7fffe;
      box-shadow: 0 2.5px 12px #71fbe912;
      transition: all 0.22s;
      text-decoration: none;
    }
    .social-icons a:hover {
      background: #0fe5b5;
      border-color: #0fe5b5;
      color: #15323b;
      transform: translateY(-3px) scale(1.08);
      box-shadow: 0 6px 18px #19e69a31;
    }

    .glass-card {
      position: relative;
      margin: 120px auto 40px auto;
      max-width: 800px;
      width: 98%;
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 3.5rem;
      align-items: center;
      background: rgba(255,255,255,0.15);
      border-radius: 30px;
      box-shadow: 0 8px 48px 0 rgba(32,212,185,0.11), 0 4px 20px 0 rgba(61,171,210,0.16);
      backdrop-filter: blur(18px);
      border: 1.2px solid rgba(177,222,205,0.17);
      z-index: 2;
      padding: 2.8rem 1.8rem;
    }
    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .profile-image {
      width: 220px;
      height: 220px;
      border-radius: 30px;
      background: url('images/basanta.jpg') center/cover;
      box-shadow: 0 0 40px 0 #a6ffd9cc, 0 5px 32px 0 #12e1ea43;
      margin-bottom: 2rem;
      border: 3.2px solid #d2fcc7;
    }
    .profile-image:hover {
      box-shadow: 0 0 55px 0 #bfffd2, 0 8px 48px 0 #0ff1cd55;
    }
    .hire-btn {
      background: linear-gradient(92deg,#07a9ee 30%, #16e19c 100%);
      color: white;
      padding: 1.1rem 2.3rem;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 18px #13e5c299;
      transition: all 0.23s;
      box-shadow: 0 2.5px 14px rgba(37, 202, 235, 0.18);
      text-decoration: none;
    }
    .hire-btn:hover {
      background: linear-gradient(93deg,#53f6f1 0%, #82f7b1 86%);
      color: #041b23;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 12px 32px rgba(45, 203, 183, 0.13);
    }
    h1 {
      font-size: 3.2rem;
      font-weight: 300;
      margin-bottom: 1rem;
      color: #e6fff7;
      line-height: 1.1;
      letter-spacing: 0.014em;
    }
    h1 span.name {
      font-weight: 700;
      color: #13e1e7;
      background: linear-gradient(93deg,#13e1e7,#00ffb8 83%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
      position: relative;
      z-index: 1;
    }
    .subtitle {
      font-size: 1.3rem;
      color: #95fbc6;
      margin-bottom: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 8px #1ea7a266;
    }
    .description {
      font-size: 1.09rem;
      color: #ddf7eb;
      margin-bottom: 2rem;
      line-height: 1.70;
      max-width: 440px;
      font-weight: 400;
    }
    @media (max-width: 920px) {
      .glass-card { grid-template-columns: 1fr; gap: 2.1rem; text-align: center;}
      .content {padding-right: 0;}
      .profile-section {margin: 0 auto;}
      header {padding-left: 1rem;padding-right:1rem;}
    }
    @media (max-width: 600px) {
      .glass-card { padding: 1.1em 0.5em;}
      .profile-image { width: 130px; height: 130px;}
      h1 { font-size: 2rem;}
      .subtitle {font-size: 1.05rem;}
      main {padding: 90px 0 18px 0;}
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">Basanta Ghimire</div>
      <div class="nav-links">
        <a href="index.html" class="active">Home</a>
        <a href="aboutme.html">About</a>
        <a href="research.html">Research</a>
        <a href="cv.html">CV</a>
      </div>
      <div class="social-icons">
        <a href="https://linkedin.com/in/basanta-ghimire" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="mailto:basanta@email.com" title="Email"><i class="fas fa-envelope"></i></a>
      </div>
    </nav>
  </header>
  <main>
    <div class="glass-card">
      <div class="content">
        <h1>Hi, I'm <span class="name">Basanta</span></h1>
        <div class="subtitle">Energy Systems Engineer</div>
        <div class="description">
          I specialize in designing innovative energy generation and storage solutions.<br>
          Passionate about sustainable technology and creating efficient power systems for the future.
        </div>
      </div>
      <div class="profile-section">
        <div class="profile-image"></div>
        <a href="cv.html" class="hire-btn">Hire Me</a>
      </div>
    </div>
  </main>
</body>
</html>
