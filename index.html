
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basanta Ghimire</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: #333;
            background: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* Main Container */
        main {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 4rem;
            align-items: center;
        }

        .content {
            max-width: 600px;
        }

        h1 {
            font-size: 4rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            color: #000;
            line-height: 1;
        }

        .name {
            font-weight: 600;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 3rem;
            font-weight: 400;
        }

        /* Navigation Links */
        .nav-sections {
            display: flex;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .nav-sections a {
            font-size: 1rem;
            color: #666;
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 400;
        }

        .nav-sections a:hover {
            color: #000;
        }

        /* Social Icons */
        .social-links {
            display: flex;
            gap: 1rem;
        }

        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: #f5f5f5;
            border-radius: 50%;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background: #000;
            transform: translateY(-2px);
        }

        /* Profile Section */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-image {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: url('images/basanta.jpg');
            background-size: cover;
            background-position: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .profile-image:hover {
            transform: scale(1.02);
        }

        /* Chat Bot Button */
        .chat-button {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            background: #000;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .chat-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.4);
        }

        /* Chat Window */
        .chat-window {
            position: fixed;
            bottom: 100px;
            right: 2rem;
            width: 350px;
            height: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.2);
            display: none;
            flex-direction: column;
            z-index: 999;
            overflow: hidden;
        }

        .chat-window.active {
            display: flex;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-header {
            background: #000;
            color: white;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .close-chat {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            background: #fafafa;
        }

        .message {
            margin-bottom: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 15px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message.bot .message-bubble {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .message.user .message-bubble {
            background: #000;
            color: white;
        }

        .chat-input-area {
            padding: 1rem;
            background: white;
            border-top: 1px solid #e5e5e5;
            display: flex;
            gap: 0.5rem;
        }

        .chat-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #e5e5e5;
            border-radius: 25px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .chat-input:focus {
            border-color: #000;
        }

        .send-button {
            background: #000;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .send-button:hover {
            transform: scale(1.1);
        }

        .send-button:active {
            transform: scale(0.95);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 3rem;
                text-align: center;
            }

            .content {
                order: 2;
                margin: 0 auto;
            }

            .profile-section {
                order: 1;
            }

            .profile-image {
                width: 220px;
                height: 220px;
            }

            h1 {
                font-size: 3rem;
            }

            .nav-sections {
                justify-content: center;
            }

            .social-links {
                justify-content: center;
            }

            .chat-window {
                width: calc(100vw - 2rem);
                right: 1rem;
                left: 1rem;
                height: 450px;
            }

            .chat-button {
                right: 1rem;
                bottom: 1rem;
            }
        }

        @media (max-width: 480px) {
            main {
                padding: 1rem;
            }

            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .profile-image {
                width: 180px;
                height: 180px;
            }

            .nav-sections {
                flex-direction: column;
                gap: 1rem;
                align-items: center;
            }
        }

        /* Scrollbar Styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f0f0f0;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="content">
                <h1><span class="name">Basanta Ghimire</span></h1>
                <p class="subtitle">Energy Systems Engineer</p>

                <div class="nav-sections">
                    <a href="#research">Research</a>
                    <a href="#about">About</a>
                    <a href="#cv">CV</a>
                    <a href="#contact">Contact</a>
                </div>

                <div class="social-links">
                    <a href="#" title="LinkedIn">💼</a>
                    <a href="#" title="GitHub">💻</a>
                    <a href="#" title="Email">📧</a>
                    <a href="#" title="ResearchGate">🔬</a>
                </div>
            </div>

            <div class="profile-section">
                <div class="profile-image"></div>
            </div>
        </div>
    </main>

    <!-- Chat Bot -->
    <button class="chat-button" onclick="toggleChat()">💬</button>

    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <h3>Chat with me</h3>
            <button class="close-chat" onclick="toggleChat()">×</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-bubble">
                    Hi! I'm Basanta's assistant. How can I help you today?
                </div>
            </div>
        </div>
        <div class="chat-input-area">
            <input 
                type="text" 
                class="chat-input" 
                id="chatInput" 
                placeholder="Type a message..."
                onkeypress="handleKeyPress(event)"
            >
            <button class="send-button" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        function toggleChat() {
            const chatWindow = document.getElementById('chatWindow');
            chatWindow.classList.toggle('active');
            if (chatWindow.classList.contains('active')) {
                document.getElementById('chatInput').focus();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (message === '') return;
            
            // Add user message
            addMessage(message, 'user');
            input.value = '';
            
            // Simulate bot response
            setTimeout(() => {
                const response = getBotResponse(message.toLowerCase());
                addMessage(response, 'bot');
            }, 500);
        }

        function addMessage(text, sender) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.textContent = text;
            
            messageDiv.appendChild(bubbleDiv);
            messagesContainer.appendChild(messageDiv);
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function getBotResponse(message) {
            const responses = {
                'hello': 'Hello! How can I assist you today?',
                'hi': 'Hi there! What would you like to know?',
                'research': 'Basanta specializes in energy generation and storage systems. Check out the Research section for more details!',
                'contact': 'You can reach Basanta via email at basanta@email.com or through LinkedIn.',
                'cv': 'You can download Basanta\'s CV from the CV section above.',
                'about': 'Basanta is an Energy Systems Engineer with expertise in sustainable power solutions.',
                'experience': 'Basanta has extensive experience in energy storage and renewable energy systems.',
                'skills': 'Key skills include energy systems design, battery technology, and sustainable engineering.',
                'projects': 'Please visit the Research section to see current and past projects.',
                'email': 'You can email at basanta@email.com',
                'linkedin': 'Connect on LinkedIn through the social links above!',
                'help': 'I can help you learn about Basanta\'s research, experience, and contact information. What would you like to know?'
            };
            
            // Check for keyword matches
            for (let keyword in responses) {
                if (message.includes(keyword)) {
                    return responses[keyword];
                }
            }
            
            return 'That\'s interesting! You can explore the sections above to learn more about Basanta\'s work, or feel free to reach out directly via email.';
        }

        // Smooth scrolling for navigation
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const section = this.getAttribute('href');
                console.log('Navigate to:', section);
            });
        });
    </script>
</body>
</html>
