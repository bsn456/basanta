<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basanta Ghimire - Energy Engineer</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      color: #333;
      background: #fafafa;
      height: 100%;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      z-index: 1000;
      padding: 1rem 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }
    nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 600;
      color: #2563eb;
    }
    .nav-links {
      display: flex;
      list-style: none;
      gap: 2rem;
    }
    .nav-links a {
      text-decoration: none;
      color: #64748b;
      font-weight: 400;
      font-size: 0.95rem;
      transition: color 0.3s ease;
    }
    .nav-links a:hover {
      color: #2563eb;
    }
    .social-icons {
      display: flex;
      gap: 1rem;
    }
    .social-icons a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      text-decoration: none;
      font-size: 20px;
      color: #64748b;
      transition: all 0.3s ease;
    }
    .social-icons a:hover {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
      transform: translateY(-2px);
    }
    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 0 32px 0;
    }
    .container {
      max-width: 800px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 4rem;
      align-items: center;
    }
    .content {
      padding-right: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .profile-image {
      width: 280px;
      height: 280px;
      border-radius: 20px;
      background: url('images/basanta.jpg') center/cover;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      margin-bottom: 2rem;
      transition: transform 0.3s ease;
    }
    .profile-image:hover {
      transform: translateY(-5px);
    }
    .hire-btn {
      background: #2563eb;
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 12px;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .hire-btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
    }
    h1 {
      font-size: 3.5rem;
      font-weight: 300;
      margin-bottom: 1rem;
      color: #1e293b;
      line-height: 1.1;
    }
    .name {
      font-weight: 600;
    }
    .subtitle {
      font-size: 1.3rem;
      color: #2563eb;
      margin-bottom: 2rem;
      font-weight: 500;
    }
    .description {
      font-size: 1.1rem;
      color: #64748b;
      margin-bottom: 2rem;
      line-height: 1.7;
      max-width: 500px;
    }
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        gap: 2rem;
        text-align: center;
      }
      .content {
        padding-right: 0;
        order: 2;
      }
      .profile-section {
        order: 1;
      }
      .profile-image {
        width: 220px;
        height: 220px;
      }
      h1 {
        font-size: 2.5rem;
      }
      .nav-links {
        display: none;
      }
      main {
        padding: 100px 0 24px 0;
      }
    }
    @media (max-width: 480px) {
      .profile-image {
        width: 160px;
        height: 160px;
      }
      h1 {
        font-size: 2rem;
      }
      .subtitle {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">Basanta Ghimire</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="aboutme.html">About</a>
        <a href="research.html">Research</a>
        <a href="cv.html">CV</a>
      </div>
      <div class="social-icons">
        <a href="https://linkedin.com/in/basanta-ghimire" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="https://github.com/bsn456" title="GitHub"><i class="fab fa-github"></i></a>
        <a href="mailto:basanta@email.com" title="Email"><i class="fas fa-envelope"></i></a>
      </div>
    </nav>
  </header>

  <main>
    <div class="container">
      <div class="content">
        <h1>Hi, I'm <span class="name">Basanta</span></h1>
        <p class="subtitle">Energy Systems Engineer</p>
        <p class="description">
          I specialize in designing innovative energy generation and storage solutions.
          Passionate about sustainable technology and creating efficient power systems
          for the future.
        </p>
      </div>
      <div class="profile-section">
        <div class="profile-image"></div>
        <a href="cv.html" class="hire-btn">Hire Me</a>
      </div>
    </div>
  </main>
</body>
</html>
